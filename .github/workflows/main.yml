name: Ruby CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby 3.4.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.3
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: ruby test/api_responser.rb 